<html>
    <head>
        <title>Tabel Berwarna</title>
        <style>
            table, th, td{
                border-collapse: collapse;
                border: 1px solid black;
            }
            th, td {
                
                padding: 15px;
                text-align: left;
            }
            table#berwarna{
                background-color: yellow;
                width: 100%;
            }
        </style>
    </head>
    <body>
        <table id="berwarna">
            <tr>
                <th>Nama</th>
                <th>Usia</th>
                <th>Kota</th>
            </tr>
            <tr>
                <td>John Doe</td>
                <td>30</td>
                <td>New York</td>
            </tr>
            <tr>
                <td>Jane Smith</td>
                <td>25</td>
                <td>Los Angeles</td>
            </tr>
        </table>

        <table>
            <tr>
                <th>Nama</th>
                <th>Usia</th>
                <th>Kota</th>
            </tr>
            <tr>
                <td>Bob Johnson</td>
                <td>35</td>
                <td>Chicago</td>
            </tr>
        </table>
    </body>
</html>
