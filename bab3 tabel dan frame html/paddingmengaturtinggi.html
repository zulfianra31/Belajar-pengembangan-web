<html>
    <head>
        <title>Padding Mengatur Tinggi</title>
       <style>
            table, th, td {
                border: 1px solid black;
                border-collapse: collapse;
                

            }
            th, td {
                padding: 25px; /* Mengatur padding untuk mengatur tinggi sel */
            }
       </style>
    </head>
    <body>

        <h2>Padding Mengatur Tinggi</h2>
        <p> tabel ini menggunakan padding untuk mengatur tinggi sel</p>
        <table style="width: 50%;">
            
                <tr>
                    <th>Nama</th>
                    <th>Usia</th>
                    <th>Kota</th>
                </tr>
            
            
                <tr>
                    <td>John Doe</td>
                    <td>30</td>
                    <td>New York</td>
                </tr>
                <tr>
                    <td>Jane Smith</td>
                    <td>25</td>
                    <td>Los Angeles</td>
                </tr>
        </table>
            
        
    </body>
</html>
