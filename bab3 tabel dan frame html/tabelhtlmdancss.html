<html>
<head>
    <title>Belajar Tabel HTML dan CSS</title>
    <style>
        table {
            font-family: Arial, sans-serif;
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            border: 1px solid #dddddd;
            padding: 8px;
            text-align: left;
        }
        th:nth-child(even) {
            background-color: #dddddd;
        }
    </style>
</head>
<body>
    <h2>Contoh Tabel HTML dengan CSS : penulis</h2>
    <table>
        <tr>
            <th>Nama penulis</th>
            <th>judul buku</th>
            <th>asal negara</th>
        </tr>
        <tr>
            <td>Arista Prasetyo Adi</td>
            <td>Menciptakan Passive Income Lewat Blog</td>
            <td>Indonesia</td>
        </tr>
        <tr>
            <td>Yoseline Chelsea</td>
            <td>Seri buku Belajar HTML Berhitung</td>
            <td>Prancis</td>
        </tr>
        <tr>
            <td>Sara Lenci Sri Maharani</td>
            <td>Aneka Resep Olahan Kue Dari Bahan Ketela</td>
            <td>Australia</td>
        </tr>
    </table>    
</body>
</html>
