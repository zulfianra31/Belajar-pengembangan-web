<html>
    <head>
        <title>Belajar Mengatur Border Tabel dengan CSS</title>
       <style>
            table, th, td {
                border: 2px solid black;
                
            }
       </style>
    </head>
    <body>

        <h2>mengatur border</h2>
        <p> Antar sel dipisahkan dengan border kotak yang membatasi antar data</p>
        <table style="width: 50%;">
            
                <tr>
                    <th>Nama</th>
                    <th>Usia</th>
                    <th>Kota</th>
                </tr>
            
            
                <tr>
                    <td>John Doe</td>
                    <td>30</td>
                    <td>New York</td>
                </tr>
                <tr>
                    <td>Jane Smith</td>
                    <td>25</td>
                    <td>Los Angeles</td>
                </tr>
            
        
    </body>
</html>
