<html>
    <head>
        <title>collapsed Border Tabel dengan CSS</title>
       <style>
            table, th, td {
                border: 2px solid black;
                border-collapse: collapse;
            }
       </style>
    </head>
    <body>

        <h2>collapsed border</h2>
        <p> tabel ini hanya menampilkan border yang collapsed(biasa)</p>
        <table style="width: 50%;">
            
                <tr>
                    <th>Nama</th>
                    <th>Usia</th>
                    <th>Kota</th>
                </tr>
            
            
                <tr>
                    <td>John Doe</td>
                    <td>30</td>
                    <td>New York</td>
                </tr>
                <tr>
                    <td>Jane Smith</td>
                    <td>25</td>
                    <td>Los Angeles</td>
                </tr>
        </table>
            
        
    </body>
</html>
